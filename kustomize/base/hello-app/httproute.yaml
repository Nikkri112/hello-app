# HTTPRoute - правило маршрутизации: путь / через hello-gateway -> сервис hello-app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route
  namespace: hello-app
spec:
  parentRefs:
    - name: hello-gateway              # цепляемся к Gateway
  hostnames:
    - hello-app                        # приложение доступно по имени hello-app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello-app              # трафик -> сервис
          port: 80
