# Deployment - запускает и следит за подами с нашим Python REST API.
# 2 копии (реплики) для надёжности.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: hello-app
  labels:
    app: hello-app
spec:
  replicas: 2                          # сколько копий пода запустить

  selector:
    matchLabels:
      app: hello-app                   # как Deployment находит свои поды

  template:
    metadata:
      labels:
        app: hello-app                 # метки должны совпадать с selector
    spec:
      # Pod Security Standards (restricted): не-root юзер, seccomp RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                        # emptyDir-тома получают группу 1000 (право писать)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-app
          # Публичный образ в Docker Hub (собран из этого репозитория)
          image: docker.io/nikkiraii/hello-app:2.1
          imagePullPolicy: IfNotPresent

          # Порт, который слушает приложение внутри контейнера
          ports:
            - name: http
              containerPort: 8080

          # Проверка живости: если /health перестанет отвечать - под перезапустят
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          # Проверка готовности: пока /health не ответит - трафик на под не пойдёт
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          # Container-level security: без привилегий, read-only корень, без capabilities
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # /tmp нужен gunicorn (heartbeat), /var/log/app - access-логи:
          # корень read-only, поэтому оба - emptyDir
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/app

          # Ограничения по ресурсам
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
