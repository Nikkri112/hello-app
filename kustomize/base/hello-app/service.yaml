
apiVersion: v1
kind: Service
metadata:
  name: hello-app
  namespace: hello-app
  labels:
    app: hello-app
spec:
  type: ClusterIP
  selector:
    app: hello-app                     # на какие поды отправлять трафик
  ports:
    - name: http
      port: 80
      targetPort: 8080                 # порт контейнера (см. deployment)
